name: Benchmarks

# Benchmarks build in Release mode and run on every PR and push to main.
# NO regression gate is applied — the job uploads the JSON results as an
# artifact and exits 0 unless the binary crashes. GitHub-hosted runner
# variance on tight microbenchmarks exceeds practical gate thresholds; see
# docs/decisions/012-benchmarks-no-regression-gate.md for the full rationale
# and the planned follow-up (variance characterization over ≥50 runs, then
# a Mann–Whitney U comparison gate).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_baseline:
        description: >-
          Run the suite with --benchmark_repetitions=50 and upload the
          resulting JSON as the ``bench-baseline`` artifact. Use this from
          main after a clean-room run to refresh the regression gate
          baseline. See ADR-012.
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  benchmarks:
    name: Google Benchmark (Ubuntu 24.04, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-${{ github.ref_name }}
          restore-keys: |
            bench-${{ github.ref_name }}
            bench-main
            bench-
          max-size: 1G
          verbose: 2

      - name: Install JUCE dependencies
        run: |
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure CMake (benchmarks)
        run: |
          cmake -B build/bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMULTISCOPER_BUILD_BENCHMARKS=ON \
            -DMULTISCOPER_BUILD_TESTS=OFF \
            -DMULTISCOPER_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build MultiScoperBenchmarks
        run: cmake --build build/bench --target MultiScoperBenchmarks --parallel

      # See docs/decisions/012-benchmarks-no-regression-gate.md for the full
      # rationale. Regression comparison is now wired via scripts/bench_compare.py
      # (Mann-Whitney U + Bonferroni + 10% economic tolerance) — but the gate
      # only fires when a ``bench-baseline.json`` artifact is downloadable from
      # the most recent push on ``main``. If no baseline is present, the step
      # is a no-op so the pipeline never breaks on cold starts or rerolls.
      # REPS=7 on PRs is a trade-off: enough samples for the Mann-Whitney U
      # test to have usable statistical power (n=3 was below the normal
      # approximation's validity floor; scripts/bench_compare.py handles that
      # via exact enumeration but the cliff is still real), without blowing
      # the 30-minute job timeout. REPS=50 remains the manual baseline-capture
      # mode documented in ADR-012.
      - name: Run benchmarks
        working-directory: build/bench
        env:
          REPS: ${{ (github.event.inputs.capture_baseline == 'true') && '50' || '7' }}
        run: |
          ./benchmarks/MultiScoperBenchmarks \
            --benchmark_format=json \
            --benchmark_out=bench.json \
            --benchmark_repetitions="${REPS}" \
            --benchmark_min_time=1s

      - name: Upload benchmark JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: build/bench/bench.json
          if-no-files-found: error

      # Upload the captured baseline so future runs can compare against it.
      # Only fires on manual dispatch with capture_baseline=true, run from
      # main, to prevent PR authors from moving the baseline arbitrarily.
      - name: Upload as regression-gate baseline
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.capture_baseline == 'true'
          && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: build/bench/bench.json
          if-no-files-found: error
          retention-days: 90

      # Download the latest main-branch baseline, if one has been captured.
      # ``continue-on-error: true`` — first-ever run of this workflow on a fork
      # has no baseline; we log-and-skip instead of failing the build.
      #
      # upload-artifact@v4 with a single-file ``path`` uploads the file at the
      # zip root (no directory structure preserved), so the download lands a
      # ``bench.json`` at whatever ``path`` we specify here. We route it to a
      # dedicated ``baseline/`` directory so it doesn't collide with the
      # current run's ``build/bench/bench.json``.
      - name: Download baseline (latest main)
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: bench-baseline
          branch: main
          workflow: benchmarks.yml
          path: baseline
          if_no_artifact_found: warn

      # scipy is used by scripts/bench_compare.py for the Mann-Whitney U test;
      # when available it auto-selects the exact method for small samples.
      # The pure-Python fallback in the script also has an exact path but is
      # slower, so we install scipy on CI for both correctness and speed.
      #
      # ``steps.baseline.outcome == 'success'`` is not sufficient on its own:
      # dawidd6/action-download-artifact with ``if_no_artifact_found: warn``
      # reports a successful step outcome even when no baseline artifact was
      # produced (cold-start repos, fresh forks). Additionally gate on the
      # actual file being present so the compare step doesn't try to run
      # against a nonexistent baseline path.
      - name: Install scipy (for bench_compare)
        if: steps.baseline.outcome == 'success' && hashFiles('baseline/bench.json') != ''
        run: python3 -m pip install --user scipy

      - name: Compare against baseline
        if: steps.baseline.outcome == 'success' && hashFiles('baseline/bench.json') != ''
        run: |
          ls -la baseline/bench.json build/bench/bench.json 2>/dev/null || true
          python3 scripts/bench_compare.py \
            --baseline baseline/bench.json \
            --current build/bench/bench.json \
            --metric cpu_time \
            --alpha 0.05 \
            --tolerance 0.10
